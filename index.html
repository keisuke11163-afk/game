<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#9ccf6e">
  <title>キャッスルフィールド</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="bg" aria-hidden="true"></div>

    <!-- 上：相手の手札・ターン・山札と捨て札 -->
    <header id="top-bar">
      <div class="opp-hand" title="相手の手札">
        <span class="card-stack" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="outlined num" id="opp-hand-count">0</span>
      </div>
      <div class="turn-info outlined" id="turn-info"></div>
      <div class="piles">
        <span class="pile" id="deck-pile" title="山札">
          <span class="card-stack" aria-hidden="true"><i></i><i></i></span>
          <span class="outlined num" id="deck-count">0</span>
        </span>
        <span class="pile discard" id="discard-pile" title="捨て札">
          <span class="card-stack" aria-hidden="true"><i></i><i></i></span>
          <span class="outlined num" id="discard-count">0</span>
        </span>
      </div>
    </header>

    <!-- 盤面：相手の城 / 1本の道 / 自分の城 -->
    <main id="board">
      <div id="squares" aria-hidden="true"></div>
      <section class="castle" id="castle-opp" data-side="opp">
        <img class="castle-img" alt="">
        <div class="hp-sign"><img class="sign-img" alt=""><span class="hp-value outlined">0</span></div>
        <span class="castle-name outlined"></span>
      </section>
      <section class="castle" id="castle-me" data-side="me">
        <img class="castle-img" alt="">
        <div class="hp-sign"><img class="sign-img" alt=""><span class="hp-value outlined">0</span></div>
        <span class="castle-name outlined"></span>
      </section>
      <div id="units"></div>
      <div id="drop-hint" class="outlined" hidden>ここで離すと使う</div>
    </main>

    <!-- 下：自分の操作 -->
    <footer id="controls">
      <div id="card-detail" class="parchment" hidden>
        <div class="detail-text">
          <div class="detail-head"><b class="detail-name"></b><span class="detail-kind"></span></div>
          <div class="detail-desc"></div>
          <div class="detail-hint"></div>
        </div>
        <button type="button" class="detail-use plank-button"><span>使う</span></button>
      </div>
      <div id="discard-bar" class="parchment" hidden>
        <span class="discard-msg"></span>
        <button type="button" class="discard-ok plank-button"><span>捨てる</span></button>
      </div>
      <div class="control-row">
        <p id="message" class="outlined"></p>
        <button id="end-turn" type="button" class="plank-button"><span>ターン終了</span></button>
      </div>
      <div id="hand"></div>
    </footer>

    <div id="toast" class="parchment" role="status" aria-live="polite"></div>
    <div id="fx-layer" aria-hidden="true"></div>

    <!-- 手番交代：相手の手札を隠す -->
    <div id="handover" class="screen" hidden>
      <div class="page">
        <img class="page-img" alt="">
        <div class="page-text">
          <p class="handover-turn"></p>
          <img class="handover-castle" alt="">
          <p class="handover-title"></p>
          <p class="screen-sub">タップしてはじめる</p>
        </div>
      </div>
    </div>

    <!-- 勝敗 -->
    <div id="result" class="screen" hidden>
      <div class="confetti" aria-hidden="true"></div>
      <div class="result-box">
        <img class="result-castle" alt="">
        <div class="banner">
          <img class="banner-img" alt="">
          <p class="result-title outlined"></p>
        </div>
        <p class="result-sub outlined"></p>
        <button type="button" id="rematch" class="plank-button big"><span>もう1回</span></button>
      </div>
    </div>

    <!-- 読み込み中 -->
    <div id="loading">
      <p class="loading-title outlined">キャッスルフィールド</p>
      <p class="loading-text outlined">読み込み中…</p>
    </div>

    <div id="error" hidden></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
