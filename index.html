<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151a26">
  <title>キャッスルフィールド</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- 上：相手の情報と、山札・捨て札 -->
    <header id="top-bar">
      <div class="opp-info">
        <span class="player-name" id="opp-name"></span>
        <span class="opp-hand" title="相手の手札">
          <span class="card-back-icon" aria-hidden="true"></span>
          <b id="opp-hand-count">0</b>枚
        </span>
        <span class="coins" id="opp-coins" title="相手のコイン" hidden><span class="coin-icon" aria-hidden="true"></span><b>0</b></span>
      </div>
      <div class="turn-info" id="turn-info"></div>
      <div class="pile-info">
        <span class="pile" id="deck-pile">山札 <b id="deck-count">0</b></span>
        <span class="pile" id="discard-pile">捨て札 <b id="discard-count">0</b></span>
      </div>
    </header>

    <!-- 盤面：相手の城 / 1本の道（左が相手の兵士・右が自分の兵士） / 自分の城 -->
    <main id="board">
      <section class="castle" id="castle-opp" data-side="opp">
        <div class="castle-body">
          <div class="castle-wall" aria-hidden="true"></div>
          <div class="castle-label" id="castle-opp-label"></div>
          <div class="castle-armor" hidden></div>
          <div class="hp-row">
            <div class="hp-bar"><div class="hp-lag"></div><div class="hp-fill"></div></div>
            <div class="hp-text"><b class="hp-value">0</b><span class="hp-max"></span></div>
          </div>
        </div>
      </section>

      <section id="field">
        <div class="lane" id="lane-opp" data-side="opp">
          <div class="lane-label"></div>
          <div class="cells"></div>
          <div class="soldier-layer"></div>
        </div>
        <div class="lane" id="lane-me" data-side="me">
          <div class="lane-label"></div>
          <div class="cells"></div>
          <div class="soldier-layer"></div>
        </div>
        <div id="monster-layer"></div>
        <div id="drop-hint" hidden>ここで離すと使う</div>
      </section>

      <section class="castle" id="castle-me" data-side="me">
        <div class="castle-body">
          <div class="castle-wall" aria-hidden="true"></div>
          <div class="castle-label" id="castle-me-label"></div>
          <div class="castle-armor" hidden></div>
          <div class="hp-row">
            <div class="hp-bar"><div class="hp-lag"></div><div class="hp-fill"></div></div>
            <div class="hp-text"><b class="hp-value">0</b><span class="hp-max"></span></div>
          </div>
        </div>
      </section>
    </main>

    <!-- 下：自分の操作 -->
    <footer id="controls">
      <div id="card-detail" hidden>
        <div class="detail-text">
          <div class="detail-head"><span class="detail-kind"></span><b class="detail-name"></b></div>
          <div class="detail-desc"></div>
          <div class="detail-hint"></div>
        </div>
        <button type="button" class="detail-use">使う</button>
      </div>
      <div id="target-bar" hidden>
        <span class="target-msg"></span>
        <button type="button" class="target-cancel">やめる</button>
      </div>
      <div id="discard-bar" hidden>
        <span class="discard-msg"></span>
        <button type="button" class="discard-ok">捨てる</button>
      </div>
      <div class="control-row">
        <p id="message"></p>
        <button id="upgrade-open" type="button" title="コインで強化を買う" hidden>
          <span class="coin-icon" aria-hidden="true"></span><b id="my-coins">0</b><span class="upgrade-open-label">強化</span>
        </button>
        <button id="end-turn" type="button">ターン終了</button>
      </div>
      <div id="hand"></div>
    </footer>

    <!-- コインで買う強化 -->
    <div id="upgrade-panel" hidden>
      <div class="upgrade-head">
        <b>強化を買う</b>
        <span class="upgrade-coins"></span>
        <button type="button" class="upgrade-close" aria-label="閉じる">✕</button>
      </div>
      <div class="upgrade-list"></div>
      <p class="upgrade-note">コインは魔物にとどめを刺すともらえます。強化はメインの1枚とは別に、何回でも買えます</p>
    </div>

    <div id="toast" role="status" aria-live="polite"></div>
    <div id="fx-layer" aria-hidden="true"></div>

    <!-- 手番交代：相手の手札を隠す -->
    <div id="handover" class="screen" hidden>
      <div class="screen-box">
        <p class="handover-turn"></p>
        <p class="handover-title"></p>
        <p class="screen-sub">タップして始める</p>
      </div>
    </div>

    <!-- 勝敗 -->
    <div id="result" class="screen" hidden>
      <div class="confetti" aria-hidden="true"></div>
      <div class="screen-box">
        <p class="result-crown" aria-hidden="true">👑</p>
        <p class="result-title"></p>
        <p class="result-sub"></p>
        <button type="button" id="rematch">もう1回</button>
      </div>
    </div>

    <div id="error" hidden></div>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
